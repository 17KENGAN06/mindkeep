<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- seo:start: scripts/prerender.ts rewrites this block for every public page -->
    <title>Mindkeep</title>
    <meta name="description" content="Mindkeep — daily tasks, spaced repetition, notes, habits, a calorie tracker and a budget in one place." />
    <!-- seo:end -->
    <meta name="theme-color" content="#090c0e" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafbfb" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" href="/favicon.png?v=4" type="image/png" sizes="1024x1024" />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.png?v=4" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://api.mindkeep.cloud" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lr_theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
