    />

    <meta name="theme-color" content="#eef3f0" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />

      property="og:description"

      name="twitter:description"
      content="Фиксированные повторения через 3, 7 и 30 дней."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap"

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Mindkeep",
        "url": "https://mindkeep.cloud/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "Keep what you learn with fixed 3, 7 and 30 day review intervals.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "EUR"
        }
      }
    </script>

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('lr_theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
