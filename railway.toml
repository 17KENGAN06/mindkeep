# Railway config for monorepo root (Root Directory must be EMPTY / ".")
[build]
builder = "NIXPACKS"
buildCommand = "npm install --include=dev && npm run build -w learning-reminder-server"
watchPatterns = ["/server/**"]

[deploy]
startCommand = "npm run start:prod -w learning-reminder-server"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
